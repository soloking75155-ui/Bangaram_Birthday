const labels=['Open your wish','See your memories','A picture of us','A little letter','One more thing…','The surprise!','One last message'];
function dots(){progress.innerHTML=labels.map((_,i)=>`<span class="dot ${i<=step?'active':''}"></span>`).join('')}
function button(text){return `<button class="btn" id="next">${text}　♡</button>`}
function render(){dots(); let body='';
if(step===0){body=`<div class="eyebrow">For my beautiful Bangaram</div><h1>Happy Birthday<br>Bangaram! 💗</h1><img class="hero-img reveal" src="${photos.blessing}" alt="Birthday blessing card"><p>May God fill your new year with strength, grace, endless joy and beautiful moments. Keep smiling, knowing you are deeply loved. ♡</p>${button('Next surprise')}`;hint.textContent='Your birthday wish is waiting…';}

if(step===2){body=`<div class="eyebrow">My favourite us</div><h2>Better together ❤️</h2><img class="hero-img reveal" src="${photos.couple}" alt="A photo of us together"><p>My favourite kind of happiness is being beside you. Here’s to us and all the memories still waiting to happen.</p>${button('Read your letter')}`;hint.textContent='A moment I want to keep forever.';}
if(step===3){body=`<div class="eyebrow">A letter from my heart</div><h2>For my Bangaram 💌</h2><img class="hero-img reveal" src="${photos.letter}" alt="Birthday love letter"><p>Every word comes from my heart. You deserve all the happiness in this world, today and always.</p>${button('Continue')}`;hint.textContent='Take your time reading it. ♡';}
if(step===4){body=`<div class="eyebrow">Wait… there’s more</div><div class="heart">💗</div><div class="bigquestion">Want to see<br>surprise ????????</div><p>One more little surprise is waiting just for you…</p>${button('YES! Show me')}`;hint.textContent='I saved the best for this moment ✨';}
if(step===5){body=`<div class="eyebrow">Surprise, my love!</div><h2>Happy Birthday, Bangaram! 💐</h2><img class="hero-img reveal" src="${photos.surprise}" alt="A birthday surprise from me"><p>Sending you all my love, a thousand smiles, and the biggest hug. ❤️</p>${button('One last thing')}`;hint.textContent='A little something from your favourite person.';}
if(step===6){body=`<div class="eyebrow">Always yours</div><div class="heart">💍</div><h2>And finally…</h2><p class="signature">Your's Husband<br>Raaaajjjjuuuuuu ❤️</p><p>Forever cheering for you, loving you, and choosing you. Happy Birthday, my Bangaram!</p><div class="heart">💕</div><button class="btn" id="again">Replay our surprise ↻</button>`;hint.textContent='Made with all my love, just for you.';}
